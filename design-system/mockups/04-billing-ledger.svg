<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#F8FAFC;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="shadow-card" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- TOPBAR -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="40" cy="32" r="14" fill="#4F46E5"/>
  <path d="M35 32 L39 26 L45 38 L41 32 Z" fill="#FFFFFF"/>
  <text x="64" y="37" font-size="16" font-weight="700" fill="#0F172A">ProxyAI</text>
  <rect x="135" y="24" width="75" height="18" rx="4" fill="#EEF2FF"/>
  <text x="142" y="37" font-size="10" font-weight="600" fill="#4F46E5">ENTERPRISE</text>

  <!-- SIDEBAR -->
  <rect x="0" y="64" width="220" height="836" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="16" y="88" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="111" font-size="13" font-weight="500" fill="#475569">Dashboard Geral</text>

  <rect x="16" y="132" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="155" font-size="13" font-weight="500" fill="#475569">Hub de Provedores</text>

  <rect x="16" y="176" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="199" font-size="13" font-weight="500" fill="#475569">Construtor Combos</text>

  <rect x="16" y="220" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="243" font-size="13" font-weight="500" fill="#475569">Chaves Virtuais</text>

  <rect x="16" y="264" width="188" height="36" rx="8" fill="#EEF2FF"/>
  <circle cx="36" cy="282" r="4" fill="#4F46E5"/>
  <text x="52" y="287" font-size="13" font-weight="600" fill="#4F46E5">Faturamento &amp; Ledger</text>

  <!-- MAIN VIEWPORT -->
  <g transform="translate(244, 88)">
    <text x="0" y="24" font-size="22" font-weight="700" fill="#0F172A">Centro de Faturamento &amp; Ledger Atômico</text>
    <text x="0" y="44" font-size="12" fill="#64748B">Gestão comercial de saldos pré-pagos, cotas recorrentes e reconciliação financeira em tempo real</text>

    <!-- RIGHT ACTION: ADD CREDITS -->
    <rect x="990" y="14" width="174" height="36" rx="8" fill="#10B981"/>
    <text x="1010" y="37" font-size="13" font-weight="600" fill="#FFFFFF">+ Comprar Créditos</text>

    <!-- 3 BILLING OVERVIEW CARDS -->
    <rect x="0" y="70" width="370" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="24" y="98" font-size="13" font-weight="600" fill="#64748B">Saldo Pré-Pago Disponível</text>
    <text x="24" y="138" font-size="30" font-weight="700" fill="#0F172A">R$ 4.850,20</text>
    <text x="24" y="166" font-size="11" fill="#10B981">Reserva ativa no Redis (Holds): R$ 12,40</text>

    <rect x="396" y="70" width="370" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="420" y="98" font-size="13" font-weight="600" fill="#64748B">Cota do Plano Mensal (Pro)</text>
    <text x="420" y="138" font-size="30" font-weight="700" fill="#4F46E5">68% <tspan font-size="16" font-weight="500" fill="#64748B">usado</tspan></text>
    
    <!-- PROGRESS BAR -->
    <rect x="420" y="156" width="320" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="420" y="156" width="217" height="8" rx="4" fill="#4F46E5"/>

    <rect x="792" y="70" width="370" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="816" y="98" font-size="13" font-weight="600" fill="#64748B">Margem de Revenda Bruta</text>
    <text x="816" y="138" font-size="30" font-weight="700" fill="#059669">+ R$ 2.410,80</text>
    <text x="816" y="166" font-size="11" fill="#64748B">Multiplicador médio aplicado: 2.0x (100% markup)</text>

    <!-- LEDGER AUDIT TABLE (POST-STREAM SETTLEMENT) -->
    <rect x="0" y="210" width="1164" height="570" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="24" y="244" font-size="16" font-weight="700" fill="#0F172A">Extrato de Conciliação Financeira (Credit Ledger Imutável)</text>
    <text x="24" y="264" font-size="11" fill="#64748B">Débitos pós-streaming com tolerância zero a saldo negativo (PostgreSQL + RLS)</text>

    <!-- TABLE HEADER -->
    <rect x="24" y="284" width="1116" height="36" rx="6" fill="#F8FAFC"/>
    <text x="36" y="306" font-size="11" font-weight="700" fill="#64748B">ID TRANSAÇÃO</text>
    <text x="180" y="306" font-size="11" font-weight="700" fill="#64748B">DATA/HORA</text>
    <text x="310" y="306" font-size="11" font-weight="700" fill="#64748B">CHAVE API / APP</text>
    <text x="500" y="306" font-size="11" font-weight="700" fill="#64748B">PROVEDOR / MODELO</text>
    <text x="730" y="306" font-size="11" font-weight="700" fill="#64748B">TOKENS (IN/OUT)</text>
    <text x="910" y="306" font-size="11" font-weight="700" fill="#64748B">VALOR DEBITADO</text>
    <text x="1050" y="306" font-size="11" font-weight="700" fill="#64748B">ESTADO</text>

    <!-- LEDGER ROW 1 -->
    <text x="36" y="344" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748B">tx_8f912a</text>
    <text x="180" y="344" font-size="12" fill="#0F172A">15/10/2026 14:32:01</text>
    <text x="310" y="344" font-size="12" font-weight="600" fill="#0F172A">Agente Suporte (Chatbot)</text>
    <text x="500" y="344" font-size="12" fill="#10A37F">OpenAI / gpt-4o</text>
    <text x="730" y="344" font-size="12" font-family="'JetBrains Mono', monospace" fill="#0F172A">1.820 in / 412 out</text>
    <text x="910" y="344" font-size="12" font-weight="700" fill="#DC2626">- R$ 0,042</text>
    <rect x="1050" y="330" width="75" height="20" rx="10" fill="#ECFDF5"/>
    <text x="1062" y="344" font-size="10" font-weight="700" fill="#059669">SETTLED</text>

    <!-- LEDGER ROW 2 -->
    <text x="36" y="388" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748B">tx_8f912b</text>
    <text x="180" y="388" font-size="12" fill="#0F172A">15/10/2026 14:31:55</text>
    <text x="310" y="388" font-size="12" font-weight="600" fill="#0F172A">IDE Extension (OpenCode)</text>
    <text x="500" y="388" font-size="12" fill="#D97706">Anthropic / claude-3-5-sonnet</text>
    <text x="730" y="388" font-size="12" font-family="'JetBrains Mono', monospace" fill="#0F172A">6.400 in / 1.100 out</text>
    <text x="910" y="388" font-size="12" font-weight="700" fill="#DC2626">- R$ 0,185</text>
    <rect x="1050" y="374" width="75" height="20" rx="10" fill="#ECFDF5"/>
    <text x="1062" y="388" font-size="10" font-weight="700" fill="#059669">SETTLED</text>

    <!-- LEDGER ROW 3 (RECARGA MERCADO PAGO / PIX) -->
    <rect x="24" y="412" width="1116" height="42" rx="4" fill="#F0FDF4"/>
    <text x="36" y="437" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">pix_991823</text>
    <text x="180" y="437" font-size="12" font-weight="600" fill="#059669">15/10/2026 14:28:10</text>
    <text x="310" y="437" font-size="12" font-weight="700" fill="#059669">Recarga de Créditos (PIX)</text>
    <text x="500" y="437" font-size="12" fill="#059669">Gateway Mercado Pago</text>
    <text x="730" y="437" font-size="12" fill="#059669">—</text>
    <text x="910" y="437" font-size="12" font-weight="700" fill="#059669">+ R$ 500,00</text>
    <rect x="1050" y="423" width="75" height="20" rx="10" fill="#DCFCE7"/>
    <text x="1062" y="437" font-size="10" font-weight="700" fill="#15803D">CREDIT</text>

    <!-- LEDGER ROW 4 -->
    <text x="36" y="482" font-size="11" font-family="'JetBrains Mono', monospace" fill="#64748B">tx_8f912c</text>
    <text x="180" y="482" font-size="12" fill="#0F172A">15/10/2026 14:25:40</text>
    <text x="310" y="482" font-size="12" font-weight="600" fill="#0F172A">Crawler Resumos</text>
    <text x="500" y="482" font-size="12" fill="#EC4899">DuckDuckGo / Claude Web</text>
    <text x="730" y="482" font-size="12" font-family="'JetBrains Mono', monospace" fill="#0F172A">950 in / 320 out</text>
    <text x="910" y="482" font-size="12" font-weight="700" fill="#DC2626">- R$ 0,010</text>
    <rect x="1050" y="468" width="75" height="20" rx="10" fill="#ECFDF5"/>
    <text x="1062" y="482" font-size="10" font-weight="700" fill="#059669">SETTLED</text>

    <!-- PAGINATION -->
    <line x1="24" y1="520" x2="1140" y2="520" stroke="#F1F5F9" stroke-width="1"/>
    <text x="36" y="550" font-size="12" fill="#64748B">Mostrando 1 a 4 de 12.480 transações</text>
    <rect x="1010" y="534" width="60" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1022" y="551" font-size="11" font-weight="600" fill="#64748B">Anterior</text>
    <rect x="1080" y="534" width="60" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1092" y="551" font-size="11" font-weight="600" fill="#64748B">Próximo</text>
  </g>
</svg>
