<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" style="background:transparent;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="modal-shadow-pix" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect x="0" y="0" width="540" height="460" fill="#0F172A" fill-opacity="0.4"/>

  <!-- CONTAINER -->
  <rect x="30" y="20" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#modal-shadow-pix)"/>

  <!-- HEADER -->
  <text x="54" y="56" font-size="17" font-weight="700" fill="#0F172A">Adicionar Créditos à Carteira</text>
  <text x="54" y="74" font-size="12" fill="#64748B">Liberação instantânea de saldo via PIX com reconciliação no ledger</text>
  <circle cx="480" cy="52" r="12" fill="#F1F5F9"/>
  <text x="476" y="57" font-size="14" fill="#64748B">×</text>

  <line x1="30" y1="92" x2="510" y2="92" stroke="#F1F5F9" stroke-width="1"/>

  <!-- VALORES SUGERIDOS -->
  <text x="54" y="118" font-size="12" font-weight="600" fill="#475569">Escolha o Valor da Recarga</text>
  <g transform="translate(54, 130)">
    <rect x="0" y="0" width="95" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="27" font-size="13" font-weight="700" fill="#0F172A">R$ 100</text>

    <rect x="108" y="0" width="95" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="132" y="27" font-size="13" font-weight="700" fill="#0F172A">R$ 250</text>

    <rect x="216" y="0" width="95" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="240" y="27" font-size="13" font-weight="700" fill="#059669">R$ 500</text>

    <rect x="324" y="0" width="95" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="342" y="27" font-size="13" font-weight="700" fill="#0F172A">R$ 1.000</text>
  </g>

  <!-- QR CODE PLACEHOLDER PIX -->
  <g transform="translate(205, 195)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <!-- SIMULAÇÃO QR CODE -->
    <rect x="15" y="15" width="30" height="30" fill="#0F172A"/>
    <rect x="20" y="20" width="20" height="20" fill="#FFFFFF"/>
    <rect x="25" y="25" width="10" height="10" fill="#0F172A"/>

    <rect x="85" y="15" width="30" height="30" fill="#0F172A"/>
    <rect x="90" y="20" width="20" height="20" fill="#FFFFFF"/>
    <rect x="95" y="25" width="10" height="10" fill="#0F172A"/>

    <rect x="15" y="85" width="30" height="30" fill="#0F172A"/>
    <rect x="20" y="90" width="20" height="20" fill="#FFFFFF"/>
    <rect x="25" y="95" width="10" height="10" fill="#0F172A"/>

    <rect x="55" y="55" width="20" height="20" fill="#0F172A"/>
  </g>

  <!-- CHAVE COPIA E COLA -->
  <text x="54" y="348" font-size="11" font-weight="600" fill="#64748B">Código PIX Copia e Cola:</text>
  <rect x="54" y="356" width="420" height="32" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="68" y="376" font-size="10" font-family="'JetBrains Mono', monospace" fill="#475569">00020126580014br.gov.bcb.pix0136a629381...</text>

  <!-- FOOTER -->
  <line x1="30" y1="398" x2="510" y2="398" stroke="#F1F5F9" stroke-width="1"/>
  <circle cx="58" cy="418" r="4" fill="#10B981"/>
  <text x="68" y="422" font-size="11" fill="#059669">Aguardando confirmação do pagamento via Webhook...</text>
</svg>
