<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 110" width="1180" height="110" style="background:#F8FAFC;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- KPI 1: REQUISIÇÕES (24H) -->
  <g transform="translate(0, 5)">
    <rect x="0" y="0" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <circle cx="28" cy="28" r="14" fill="#EEF2FF"/>
    <path d="M22 28 L26 23 L31 33 L34 28" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="32" font-size="12" font-weight="600" fill="#64748B">Requisições Totais (24h)</text>
    
    <text x="16" y="68" font-size="26" font-weight="700" fill="#0F172A">4.82M</text>
    <rect x="186" y="16" width="78" height="22" rx="11" fill="#ECFDF5"/>
    <text x="198" y="31" font-size="11" font-weight="600" fill="#059669">+14.2%</text>
  </g>

  <!-- KPI 2: CUSTO UPSTREAM -->
  <g transform="translate(298, 5)">
    <rect x="0" y="0" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <circle cx="28" cy="28" r="14" fill="#FFF1F2"/>
    <path d="M23 24 L33 34 M33 24 L33 34 L23 34" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="32" font-size="12" font-weight="600" fill="#64748B">Custo Real Upstream</text>
    
    <text x="16" y="68" font-size="26" font-weight="700" fill="#0F172A">$1,248.30</text>
    <rect x="180" y="16" width="84" height="22" rx="11" fill="#F1F5F9"/>
    <text x="190" y="31" font-size="10" font-weight="600" fill="#475569">358 Provedores</text>
  </g>

  <!-- KPI 3: FATURAMENTO & MARGEM -->
  <g transform="translate(596, 5)">
    <rect x="0" y="0" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <circle cx="28" cy="28" r="14" fill="#ECFDF5"/>
    <text x="23" y="33" font-size="14" font-weight="700" fill="#059669">$</text>
    <text x="50" y="32" font-size="12" font-weight="600" fill="#64748B">Receita / Margem</text>
    
    <text x="16" y="68" font-size="26" font-weight="700" fill="#0F172A">$2,496.60</text>
    <rect x="184" y="16" width="80" height="22" rx="11" fill="#EEF2FF"/>
    <text x="194" y="31" font-size="10" font-weight="600" fill="#4F46E5">+50.0% Lucro</text>
  </g>

  <!-- KPI 4: LATÊNCIA TTFT -->
  <g transform="translate(894, 5)">
    <rect x="0" y="0" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <circle cx="28" cy="28" r="14" fill="#FFFBEB"/>
    <path d="M29 21 L24 28 L29 28 L27 35 L33 27 L28 27 Z" fill="#D97706"/>
    <text x="50" y="32" font-size="12" font-weight="600" fill="#64748B">Latência TTFT (p95)</text>
    
    <text x="16" y="68" font-size="26" font-weight="700" fill="#0F172A">132ms</text>
    <rect x="194" y="16" width="70" height="22" rx="11" fill="#ECFDF5"/>
    <text x="206" y="31" font-size="10" font-weight="600" fill="#059669">Saudável</text>
  </g>
</svg>
