<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" style="background:#FFFFFF;border-radius:12px;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="grad-indigo-stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="grad-pink-stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="24" y="32" font-size="15" font-weight="700" fill="#0F172A">Volume de Tokens em Streaming (Últimas 12h)</text>
  <text x="24" y="50" font-size="11" fill="#94A3B8">Taxa de transferência em tempo real (chunks por segundo)</text>
  
  <!-- LEGENDA -->
  <circle cx="560" cy="36" r="4.5" fill="#4F46E5"/>
  <text x="572" y="40" font-size="11" font-weight="600" fill="#475569">Completion (Saída)</text>
  <circle cx="670" cy="36" r="4.5" fill="#EC4899"/>
  <text x="682" y="40" font-size="11" font-weight="600" fill="#475569">Prompt (Entrada)</text>

  <!-- LINHAS DE GRADE HORIZONTAIS -->
  <line x1="40" y1="90" x2="720" y2="90" stroke="#F1F5F9" stroke-width="1"/>
  <text x="14" y="94" font-size="10" fill="#94A3B8">80k</text>

  <line x1="40" y1="150" x2="720" y2="150" stroke="#F1F5F9" stroke-width="1"/>
  <text x="14" y="154" font-size="10" fill="#94A3B8">50k</text>

  <line x1="40" y1="210" x2="720" y2="210" stroke="#F1F5F9" stroke-width="1"/>
  <text x="14" y="214" font-size="10" fill="#94A3B8">20k</text>

  <line x1="40" y1="270" x2="720" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <text x="22" y="274" font-size="10" fill="#94A3B8">0</text>

  <!-- ÁREA COMPLETION (INDIGO) -->
  <path d="M 40 250 Q 150 160, 260 210 T 480 110 T 720 140 L 720 270 L 40 270 Z" fill="url(#grad-indigo-stream)"/>
  <path d="M 40 250 Q 150 160, 260 210 T 480 110 T 720 140" fill="none" stroke="#4F46E5" stroke-width="2.5"/>

  <!-- ÁREA PROMPT (PINK) -->
  <path d="M 40 265 Q 150 210, 260 235 T 480 170 T 720 195 L 720 270 L 40 270 Z" fill="url(#grad-pink-stream)"/>
  <path d="M 40 265 Q 150 210, 260 235 T 480 170 T 720 195" fill="none" stroke="#EC4899" stroke-width="2"/>

  <!-- TIMESTAMPS NO EIXO X -->
  <text x="40" y="295" font-size="10" fill="#94A3B8">03:00</text>
  <text x="176" y="295" font-size="10" fill="#94A3B8">06:00</text>
  <text x="312" y="295" font-size="10" fill="#94A3B8">09:00</text>
  <text x="448" y="295" font-size="10" fill="#94A3B8">12:00</text>
  <text x="584" y="295" font-size="10" fill="#94A3B8">15:00</text>
  <text x="700" y="295" font-size="10" fill="#94A3B8">Agora</text>
</svg>
