<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" style="background:transparent;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="modal-shadow-ws" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="540" height="460" fill="#0F172A" fill-opacity="0.4"/>
  <rect x="30" y="20" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#modal-shadow-ws)"/>

  <!-- HEADER -->
  <text x="54" y="56" font-size="17" font-weight="700" fill="#0F172A">Configuração de Integração Webshare</text>
  <text x="54" y="74" font-size="12" fill="#64748B">Sincronize proxies residenciais e data center via API REST v2</text>
  <circle cx="480" cy="52" r="12" fill="#F1F5F9"/>
  <text x="476" y="57" font-size="14" fill="#64748B">×</text>

  <line x1="30" y1="92" x2="510" y2="92" stroke="#F1F5F9" stroke-width="1"/>

  <!-- API KEY INPUT -->
  <text x="54" y="118" font-size="12" font-weight="600" fill="#475569">Webshare API Token (Authorization: Token ...)</text>
  <rect x="54" y="128" width="420" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="152" font-size="12" font-family="'JetBrains Mono', monospace" fill="#0F172A">wbs_live_********************************</text>

  <!-- SELECT MODE -->
  <text x="54" y="190" font-size="12" font-weight="600" fill="#475569">Modo de Operação Padrão</text>
  <g transform="translate(54, 202)">
    <rect x="0" y="0" width="200" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#4F46E5">Direct (Data Center)</text>
    <text x="14" y="38" font-size="10" fill="#4338CA">Menor latência, alta velocidade</text>

    <rect x="220" y="0" width="200" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="234" y="22" font-size="12" font-weight="700" fill="#0F172A">Backbone (Residencial)</text>
    <text x="234" y="38" font-size="10" fill="#64748B">Máxima evasão de Turnstile/VQD</text>
  </g>

  <!-- SELECT COUNTRIES -->
  <text x="54" y="278" font-size="12" font-weight="600" fill="#475569">Filtro de Países Permitidos</text>
  <rect x="54" y="288" width="420" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="312" font-size="12" fill="#0F172A">US, BR, DE, GB (Estados Unidos, Brasil, Europa)</text>

  <!-- AUTO REFRESH CHECKBOX -->
  <rect x="54" y="348" width="16" height="16" rx="4" fill="#4F46E5"/>
  <text x="58" y="360" font-size="11" fill="#FFFFFF">✓</text>
  <text x="78" y="361" font-size="12" fill="#475569">Auto-refresh de IPs a cada 24 horas via Webshare API</text>

  <!-- FOOTER -->
  <line x1="30" y1="385" x2="510" y2="385" stroke="#F1F5F9" stroke-width="1"/>
  <rect x="290" y="398" width="95" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="316" y="420" font-size="12" font-weight="600" fill="#475569">Cancelar</text>

  <rect x="395" y="398" width="105" height="34" rx="6" fill="#4F46E5"/>
  <text x="410" y="420" font-size="12" font-weight="600" fill="#FFFFFF">Conectar API</text>
</svg>
