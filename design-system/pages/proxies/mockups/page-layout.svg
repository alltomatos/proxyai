<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#F8FAFC;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="shadow-card" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- TOPBAR -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="40" cy="32" r="14" fill="#4F46E5"/>
  <path d="M35 32 L39 26 L45 38 L41 32 Z" fill="#FFFFFF"/>
  <text x="64" y="37" font-size="16" font-weight="700" fill="#0F172A">ProxyAI</text>
  <rect x="135" y="24" width="75" height="18" rx="4" fill="#EEF2FF"/>
  <text x="142" y="37" font-size="10" font-weight="600" fill="#4F46E5">ENTERPRISE</text>

  <!-- SIDEBAR -->
  <rect x="0" y="64" width="220" height="836" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="16" y="88" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="111" font-size="13" font-weight="500" fill="#475569">Dashboard Geral</text>

  <rect x="16" y="132" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="155" font-size="13" font-weight="500" fill="#475569">Hub de Provedores</text>

  <rect x="16" y="176" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="199" font-size="13" font-weight="500" fill="#475569">Construtor Combos</text>

  <rect x="16" y="220" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="243" font-size="13" font-weight="500" fill="#475569">Empresas (Tenants)</text>

  <rect x="16" y="264" width="188" height="36" rx="8" fill="#EEF2FF"/>
  <circle cx="36" cy="282" r="4" fill="#4F46E5"/>
  <text x="52" y="287" font-size="13" font-weight="600" fill="#4F46E5">Pool Proxies (Webshare)</text>

  <rect x="16" y="308" width="188" height="36" rx="8" fill="transparent"/>
  <text x="52" y="331" font-size="13" font-weight="500" fill="#475569">Faturamento &amp; Ledger</text>

  <!-- MAIN VIEWPORT -->
  <g transform="translate(244, 88)">
    <text x="0" y="24" font-size="22" font-weight="700" fill="#0F172A">Pool de Proxies &amp; Integração Webshare</text>
    <text x="0" y="44" font-size="12" fill="#64748B">Rotação automática de IPs residenciais e data center para contornar rate-limits e Cloudflare</text>

    <!-- ACTION BUTTONS -->
    <rect x="800" y="14" width="160" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="818" y="37" font-size="12" font-weight="600" fill="#475569">Configurar Webshare</text>

    <rect x="974" y="14" width="190" height="36" rx="8" fill="#4F46E5"/>
    <text x="990" y="37" font-size="12" font-weight="600" fill="#FFFFFF">⟳ Refresh de IPs (Webshare)</text>

    <!-- 3 KPI CARDS -->
    <rect x="0" y="70" width="370" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="24" y="98" font-size="12" font-weight="600" fill="#64748B">Proxies Ativos no Pool</text>
    <text x="24" y="136" font-size="26" font-weight="700" fill="#0F172A">128 IPs Vivos</text>
    <rect x="250" y="82" width="100" height="22" rx="11" fill="#ECFDF5"/>
    <text x="264" y="97" font-size="10" font-weight="600" fill="#059669">100% Válidos</text>

    <rect x="396" y="70" width="370" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="420" y="98" font-size="12" font-weight="600" fill="#64748B">Latência Média de Saída</text>
    <text x="420" y="136" font-size="26" font-weight="700" fill="#0F172A">84ms</text>
    <rect x="646" y="82" width="100" height="22" rx="11" fill="#EEF2FF"/>
    <text x="656" y="97" font-size="10" font-weight="600" fill="#4F46E5">Quality-First</text>

    <rect x="792" y="70" width="370" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    <text x="816" y="98" font-size="12" font-weight="600" fill="#64748B">Distribuição Geográfica</text>
    <text x="816" y="136" font-size="26" font-weight="700" fill="#059669">US (85%) · BR (15%)</text>
    <rect x="1042" y="82" width="100" height="22" rx="11" fill="#ECFDF5"/>
    <text x="1056" y="97" font-size="10" font-weight="600" fill="#059669">Claude Ready</text>

    <!-- PROXY TABLE -->
    <rect x="0" y="186" width="1164" height="580" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-card)"/>
    
    <!-- TABLE HEADER -->
    <rect x="24" y="210" width="1116" height="36" rx="6" fill="#F8FAFC"/>
    <text x="36" y="232" font-size="11" font-weight="700" fill="#64748B">ENDEREÇO DO PROXY</text>
    <text x="250" y="232" font-size="11" font-weight="700" fill="#64748B">PORTA</text>
    <text x="360" y="232" font-size="11" font-weight="700" fill="#64748B">PAÍS / CIDADE</text>
    <text x="560" y="232" font-size="11" font-weight="700" fill="#64748B">MODO</text>
    <text x="740" y="232" font-size="11" font-weight="700" fill="#64748B">ÚLTIMA VERIFICAÇÃO</text>
    <text x="940" y="232" font-size="11" font-weight="700" fill="#64748B">LATÊNCIA</text>
    <text x="1050" y="232" font-size="11" font-weight="700" fill="#64748B">STATUS</text>

    <!-- ROW 1 -->
    <g transform="translate(24, 258)">
      <rect x="0" y="0" width="1116" height="52" rx="4" fill="#FFFFFF"/>
      <text x="12" y="32" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#0F172A">185.199.228.14</text>
      <text x="226" y="32" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748B">8168</text>
      <text x="336" y="32" font-size="12" font-weight="600" fill="#0F172A">🇺🇸 US / New York</text>
      <rect x="536" y="16" width="65" height="20" rx="4" fill="#EFF6FF"/>
      <text x="546" y="30" font-size="10" font-weight="600" fill="#2563EB">DIRECT</text>
      <text x="716" y="32" font-size="12" fill="#64748B">Há 2 minutos</text>
      <text x="916" y="32" font-size="12" font-weight="600" fill="#059669">42ms</text>
      <rect x="1026" y="16" width="70" height="22" rx="11" fill="#ECFDF5"/>
      <text x="1040" y="31" font-size="10" font-weight="700" fill="#059669">ONLINE</text>
      <line x1="0" y1="51" x2="1116" y2="51" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- ROW 2 -->
    <g transform="translate(24, 312)">
      <rect x="0" y="0" width="1116" height="52" rx="4" fill="#FFFFFF"/>
      <text x="12" y="32" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#0F172A">45.142.120.89</text>
      <text x="226" y="32" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748B">8168</text>
      <text x="336" y="32" font-size="12" font-weight="600" fill="#0F172A">🇺🇸 US / Los Angeles</text>
      <rect x="536" y="16" width="75" height="20" rx="4" fill="#F3E8FF"/>
      <text x="546" y="30" font-size="10" font-weight="600" fill="#7C3AED">BACKBONE</text>
      <text x="716" y="32" font-size="12" fill="#64748B">Há 5 minutos</text>
      <text x="916" y="32" font-size="12" font-weight="600" fill="#059669">68ms</text>
      <rect x="1026" y="16" width="70" height="22" rx="11" fill="#ECFDF5"/>
      <text x="1040" y="31" font-size="10" font-weight="700" fill="#059669">ONLINE</text>
      <line x1="0" y1="51" x2="1116" y2="51" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- ROW 3 -->
    <g transform="translate(24, 366)">
      <rect x="0" y="0" width="1116" height="52" rx="4" fill="#FFFFFF"/>
      <text x="12" y="32" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#0F172A">177.54.148.210</text>
      <text x="226" y="32" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748B">8168</text>
      <text x="336" y="32" font-size="12" font-weight="600" fill="#0F172A">🇧🇷 BR / São Paulo</text>
      <rect x="536" y="16" width="65" height="20" rx="4" fill="#EFF6FF"/>
      <text x="546" y="30" font-size="10" font-weight="600" fill="#2563EB">DIRECT</text>
      <text x="716" y="32" font-size="12" fill="#64748B">Há 12 minutos</text>
      <text x="916" y="32" font-size="12" font-weight="600" fill="#059669">28ms</text>
      <rect x="1026" y="16" width="70" height="22" rx="11" fill="#ECFDF5"/>
      <text x="1040" y="31" font-size="10" font-weight="700" fill="#059669">ONLINE</text>
    </g>
  </g>
</svg>
