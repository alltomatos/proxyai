<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140" style="background:#FFFFFF;border-radius:12px;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <rect x="0" y="0" width="680" height="140" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="24" y="30" font-size="14" font-weight="700" fill="#0F172A">Estados dos Botões de Ação &amp; Canary Ping</text>
  <text x="24" y="46" font-size="11" fill="#94A3B8">Feedback imediato de latência e saúde do endpoint upstream</text>

  <!-- STATE 1: IDLE -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#64748B"/>
    <text x="34" y="23" font-size="12" font-weight="600" fill="#475569">Testar Ping</text>
    <text x="0" y="52" font-size="10" fill="#94A3B8">Estado: Repouso</text>
  </g>

  <!-- STATE 2: LOADING -->
  <g transform="translate(184, 68)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="34" y="23" font-size="12" font-weight="600" fill="#4F46E5">Testando...</text>
    <text x="0" y="52" font-size="10" fill="#94A3B8">Estado: Disparando Canary</text>
  </g>

  <!-- STATE 3: SUCCESS (LATENCY) -->
  <g transform="translate(344, 68)">
    <rect x="0" y="0" width="150" height="36" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#059669"/>
    <text x="34" y="23" font-size="12" font-weight="700" fill="#059669">184ms (200 OK)</text>
    <text x="0" y="52" font-size="10" fill="#94A3B8">Estado: Sucesso</text>
  </g>

  <!-- STATE 4: ERROR / RATE-LIMIT -->
  <g transform="translate(514, 68)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#DC2626"/>
    <text x="34" y="23" font-size="12" font-weight="700" fill="#DC2626">429 Blocked</text>
    <text x="0" y="52" font-size="10" fill="#94A3B8">Estado: Rate Limit</text>
  </g>
</svg>
