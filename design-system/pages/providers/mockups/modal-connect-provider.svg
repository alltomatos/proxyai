<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" style="background:transparent;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="modal-shadow-provider" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- BACKDROP -->
  <rect x="0" y="0" width="540" height="460" fill="#0F172A" fill-opacity="0.4"/>

  <!-- MODAL -->
  <rect x="30" y="20" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#modal-shadow-provider)"/>

  <!-- HEADER -->
  <text x="54" y="56" font-size="17" font-weight="700" fill="#0F172A">Conectar Novo Provedor de IA</text>
  <text x="54" y="74" font-size="12" fill="#64748B">Adicione uma chave corporativa, credencial OAuth ou sessão web</text>
  <circle cx="480" cy="52" r="12" fill="#F1F5F9"/>
  <text x="476" y="57" font-size="14" fill="#64748B">×</text>

  <line x1="30" y1="92" x2="510" y2="92" stroke="#F1F5F9" stroke-width="1"/>

  <!-- STEP 1: TIPO DE CONEXÃO -->
  <text x="54" y="118" font-size="12" font-weight="600" fill="#475569">1. Modo de Autenticação</text>
  <g transform="translate(54, 130)">
    <!-- API KEY OPTION -->
    <rect x="0" y="0" width="130" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#4F46E5">API Key</text>
    <text x="14" y="42" font-size="10" fill="#4338CA">OpenAI, DeepSeek</text>

    <!-- OAUTH OPTION -->
    <rect x="145" y="0" width="130" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="159" y="24" font-size="12" font-weight="700" fill="#0F172A">OAuth 2.0</text>
    <text x="159" y="42" font-size="10" fill="#64748B">Codex, Claude CLI</text>

    <!-- WEB STEALTH OPTION -->
    <rect x="290" y="0" width="130" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="304" y="24" font-size="12" font-weight="700" fill="#0F172A">Web Stealth</text>
    <text x="304" y="42" font-size="10" fill="#64748B">DuckDuckGo, Cookies</text>
  </g>

  <!-- FORM FIELDS -->
  <text x="54" y="215" font-size="12" font-weight="600" fill="#475569">2. Selecione o Provedor Upstream</text>
  <rect x="54" y="225" width="420" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="248" font-size="12" fill="#0F172A">OpenAI (Oficial) — api.openai.com</text>
  <text x="450" y="248" font-size="11" fill="#94A3B8">▼</text>

  <text x="54" y="285" font-size="12" font-weight="600" fill="#475569">3. Chave de API / Segredo</text>
  <rect x="54" y="295" width="420" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="318" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B">sk-proj-********************************</text>

  <!-- ROTATE POOL CHECKBOX -->
  <rect x="54" y="348" width="16" height="16" rx="4" fill="#4F46E5"/>
  <text x="58" y="360" font-size="11" fill="#FFFFFF">✓</text>
  <text x="78" y="361" font-size="12" fill="#475569">Habilitar balanceamento automático com outras chaves ativas</text>

  <!-- FOOTER -->
  <line x1="30" y1="385" x2="510" y2="385" stroke="#F1F5F9" stroke-width="1"/>
  <rect x="290" y="398" width="95" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="316" y="420" font-size="12" font-weight="600" fill="#475569">Cancelar</text>

  <rect x="395" y="398" width="105" height="34" rx="6" fill="#4F46E5"/>
  <text x="410" y="420" font-size="12" font-weight="600" fill="#FFFFFF">Salvar Chave</text>
</svg>
