<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="380" height="280" style="background:#FFFFFF;border-radius:12px;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <rect x="0" y="0" width="380" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="20" y="30" font-size="14" font-weight="700" fill="#0F172A">Estratégias de Roteamento</text>
  <text x="20" y="46" font-size="11" fill="#94A3B8">Selecione como o tráfego será distribuído entre os modelos</text>

  <!-- OPTION 1: PRIORITY (SELECTED) -->
  <g transform="translate(18, 62)">
    <rect x="0" y="0" width="344" height="46" rx="8" fill="#F8FAFC" stroke="#4F46E5" stroke-width="1.5"/>
    <circle cx="20" cy="23" r="5" fill="#4F46E5"/>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#0F172A">Priority (Failover Sequencial)</text>
    <text x="34" y="35" font-size="10" fill="#64748B">Tenta na ordem estrita; pula em erro ou cooldown</text>
  </g>

  <!-- OPTION 2: COST OPTIMIZED -->
  <g transform="translate(18, 114)">
    <rect x="0" y="0" width="344" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="23" r="5" fill="#CBD5E1"/>
    <text x="34" y="20" font-size="12" font-weight="600" fill="#0F172A">Cost-Optimized (Modo Eco)</text>
    <text x="34" y="35" font-size="10" fill="#64748B">Prioriza o menor preço com sucesso >98%</text>
  </g>

  <!-- OPTION 3: HEADROOM / RESET AWARE -->
  <g transform="translate(18, 166)">
    <rect x="0" y="0" width="344" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="23" r="5" fill="#CBD5E1"/>
    <text x="34" y="20" font-size="12" font-weight="600" fill="#0F172A">Headroom &amp; Reset-Aware</text>
    <text x="34" y="35" font-size="10" fill="#64748B">Evita provedores perto de estourar a cota por minuto</text>
  </g>

  <!-- OPTION 4: FUSION -->
  <g transform="translate(18, 218)">
    <rect x="0" y="0" width="344" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="23" r="5" fill="#CBD5E1"/>
    <text x="34" y="20" font-size="12" font-weight="600" fill="#0F172A">Fusion (Paralelo + Juiz)</text>
    <text x="34" y="35" font-size="10" fill="#64748B">Dispara modelos simultâneos e sintetiza um consenso</text>
  </g>
</svg>
