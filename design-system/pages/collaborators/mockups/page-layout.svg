    <g transform="translate(24, 458)">
      <rect x="0" y="0" width="1116" height="60" rx="4" fill="#FFF1F2"/>
      <circle cx="20" cy="30" r="14" fill="#FEE2E2"/>
      <text x="14" y="34" font-size="11" font-weight="700" fill="#DC2626">LM</text>
      <text x="44" y="26" font-size="13" font-weight="700" fill="#991B1B">Lucas Mendes</text>
      <text x="44" y="42" font-size="11" fill="#B91C1C">user: lucas.m@acme.com · OpenCode v1.4</text>

      <text x="236" y="34" font-size="12" font-weight="600" fill="#991B1B">Estagiário Dev</text>

      <g transform="translate(396, 20)">
        <rect x="0" y="0" width="75" height="20" rx="4" fill="#F1F5F9"/>
        <text x="8" y="14" font-size="10" font-weight="600" fill="#475569">Eco-Mode</text>
      </g>

