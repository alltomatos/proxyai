    <text x="420" y="308" font-size="11" font-weight="700" fill="#64748B">MODELOS AUTORIZADOS</text>
    <text x="660" y="308" font-size="11" font-weight="700" fill="#64748B">CONSUMO PESSOAL / COTA</text>
