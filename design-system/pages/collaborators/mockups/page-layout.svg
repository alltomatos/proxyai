  <rect x="16" y="220" width="188" height="36" rx="8" fill="#EEF2FF"/>
  <circle cx="36" cy="238" r="4" fill="#4F46E5"/>
  <text x="52" y="243" font-size="13" font-weight="600" fill="#4F46E5">Equipe (OpenCode)</text>

  <rect x="16" y="264" width="188" height="36" rx="8" fill="transparent"/>
