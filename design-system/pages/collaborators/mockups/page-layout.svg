  <!-- MAIN VIEWPORT -->
  <g transform="translate(244, 88)">
    <text x="0" y="24" font-size="22" font-weight="700" fill="#0F172A">Gestão de Colaboradores &amp; Acesso OpenCode</text>
    <text x="0" y="44" font-size="12" fill="#64748B">Cadastre credenciais corporativas e defina cotas individuais de IA para os desenvolvedores no OpenCode</text>

    <!-- ACTION BUTTON -->
    <rect x="974" y="14" width="190" height="36" rx="8" fill="#4F46E5"/>
    <text x="996" y="37" font-size="13" font-weight="600" fill="#FFFFFF">+ Novo Colaborador</text>

