    <circle cx="28" cy="102" r="10" fill="#22C55E"/>
    <text x="24" y="106" font-size="12" font-weight="700" fill="#FFFFFF">i</text>
    <text x="48" y="96" font-size="13" font-weight="700" fill="#15803D">Como os colaboradores conectam no OpenCode:</text>
    <text x="48" y="116" font-size="12" fill="#166534">Basta executar no terminal da máquina do desenvolvedor:</text>
    <rect x="420" y="86" width="560" height="30" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
    <text x="435" y="106" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#0F172A">opencode auth login --proxy https://proxy.acme.com --tenant acme</text>

