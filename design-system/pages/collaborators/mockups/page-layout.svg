    <text x="420" y="218" font-size="26" font-weight="700" fill="#4F46E5">R$ 1.840,20</text>
    <rect x="656" y="164" width="90" height="22" rx="11" fill="#EEF2FF"/>
    <text x="668" y="179" font-size="10" font-weight="600" fill="#4F46E5">Teto: R$ 5.000</text>

