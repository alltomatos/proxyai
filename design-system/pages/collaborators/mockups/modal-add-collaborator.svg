  <text x="68" y="283" font-size="12" font-family="'JetBrains Mono', monospace" fill="#0F172A">R$ 150,00</text>

  <text x="274" y="250" font-size="12" font-weight="600" fill="#475569">Perfil de Permissão</text>
  <rect x="274" y="260" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="288" y="283" font-size="12" fill="#0F172A">Engenheiro / Dev Pleno ▼</text>

  <!-- MODEL ACCESS -->
  <text x="54" y="320" font-size="12" font-weight="600" fill="#475569">Acesso a Modelos no OpenCode</text>
  
  <rect x="54" y="335" width="16" height="16" rx="4" fill="#4F46E5"/>
  <text x="58" y="347" font-size="11" fill="#FFFFFF">✓</text>
