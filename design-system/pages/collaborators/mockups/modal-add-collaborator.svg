  <rect x="54" y="194" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="217" font-size="12" fill="#0F172A">gabriel.santos@acme.com</text>

  <text x="274" y="184" font-size="12" font-weight="600" fill="#475569">Senha Inicial Provisória</text>
  <rect x="274" y="194" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="288" y="217" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B">••••••••••••</text>

