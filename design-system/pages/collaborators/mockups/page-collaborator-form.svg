        <rect x="0" y="10" width="340" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="34" font-size="13" fill="#0F172A">Engenheiro de Software Pleno</text>

        <text x="362" y="0" font-size="12" font-weight="600" fill="#475569">Departamento / Time</text>
        <rect x="362" y="10" width="340" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="376" y="34" font-size="13" fill="#0F172A">Squad Core Backend</text>
