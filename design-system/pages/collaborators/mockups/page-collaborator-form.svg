      <g transform="translate(24, 580)">
        <rect x="0" y="0" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="54" y="26" font-size="13" font-weight="600" fill="#475569">Cancelar</text>

        <rect x="174" y="0" width="168" height="42" rx="6" fill="#4F46E5"/>
        <text x="206" y="26" font-size="13" font-weight="600" fill="#FFFFFF">Salvar Acesso</text>
      </g>
