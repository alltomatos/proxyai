        <text x="16" y="48" font-size="10" font-family="'JetBrains Mono', monospace" fill="#E2E8F0"># O dev executará no terminal:</text>
        <text x="16" y="72" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">opencode auth login \</text>
        <text x="28" y="90" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">--proxy https://proxy.acme.com \</text>
        <text x="28" y="108" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">--user gabriel.santos@acme.com</text>
      </g>

