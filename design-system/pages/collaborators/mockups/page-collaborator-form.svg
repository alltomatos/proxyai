        <rect x="0" y="10" width="340" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="34" font-size="13" fill="#0F172A">gabriel.santos@acme.com</text>

        <text x="362" y="0" font-size="12" font-weight="600" fill="#475569">Senha Inicial de Acesso</text>
        <rect x="362" y="10" width="340" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="376" y="34" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748B">••••••••••••••••</text>
      </g>

      <g transform="translate(0, 196)">
