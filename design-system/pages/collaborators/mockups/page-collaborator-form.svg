        <rect x="16" y="18" width="16" height="16" rx="4" fill="#4F46E5"/>
        <text x="20" y="30" font-size="11" fill="#FFFFFF">✓</text>
        <text x="44" y="26" font-size="13" font-weight="700" fill="#0F172A">Modelos Avançados (Claude 3.5 Sonnet / GPT-4o)</text>
