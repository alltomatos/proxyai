<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="540" height="460" style="background:transparent;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;">
  <defs>
    <filter id="modal-shadow-tenant" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="540" height="460" fill="#0F172A" fill-opacity="0.4"/>
  <rect x="30" y="20" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#modal-shadow-tenant)"/>

  <!-- HEADER -->
  <text x="54" y="56" font-size="17" font-weight="700" fill="#0F172A">Cadastrar Nova Empresa (Tenant)</text>
  <text x="54" y="74" font-size="12" fill="#64748B">Crie um espaço isolado para faturamento e gestão de chaves de API</text>
  <circle cx="480" cy="52" r="12" fill="#F1F5F9"/>
  <text x="476" y="57" font-size="14" fill="#64748B">×</text>

  <line x1="30" y1="92" x2="510" y2="92" stroke="#F1F5F9" stroke-width="1"/>

  <!-- FORM FIELDS -->
  <text x="54" y="118" font-size="12" font-weight="600" fill="#475569">Nome da Empresa / Organização</text>
  <rect x="54" y="128" width="420" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="151" font-size="12" fill="#0F172A">Ex: FinTech Soluções Ltda</text>

  <text x="54" y="188" font-size="12" font-weight="600" fill="#475569">Username de Acesso ao Portal</text>
  <rect x="54" y="198" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="68" y="221" font-size="12" fill="#0F172A">fintech_admin</text>

  <text x="274" y="188" font-size="12" font-weight="600" fill="#475569">Teto Orçamentário Mensal (BRL)</text>
  <rect x="274" y="198" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="288" y="221" font-size="12" font-family="'JetBrains Mono', monospace" fill="#0F172A">R$ 5.000,00</text>

  <!-- COMBOS PERMITIDOS CHECKLIST -->
  <text x="54" y="260" font-size="12" font-weight="600" fill="#475569">Combos e Modelos Autorizados</text>
  
  <rect x="54" y="275" width="16" height="16" rx="4" fill="#4F46E5"/>
  <text x="58" y="287" font-size="11" fill="#FFFFFF">✓</text>
  <text x="78" y="288" font-size="12" fill="#0F172A">Smart-Coder-Resilient (OpenAI / Claude / DeepSeek)</text>

  <rect x="54" y="303" width="16" height="16" rx="4" fill="#4F46E5"/>
  <text x="58" y="315" font-size="11" fill="#FFFFFF">✓</text>
  <text x="78" y="316" font-size="12" fill="#0F172A">Fast-General (DuckDuckGo Web / Groq Llama 3)</text>

  <rect x="54" y="331" width="16" height="16" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="78" y="344" font-size="12" fill="#64748B">Ultra-Reasoning (OpenAI o1 / o3-mini) — Tier Superior</text>

  <!-- FOOTER -->
  <line x1="30" y1="385" x2="510" y2="385" stroke="#F1F5F9" stroke-width="1"/>
  <rect x="290" y="398" width="95" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="316" y="420" font-size="12" font-weight="600" fill="#475569">Cancelar</text>

  <rect x="395" y="398" width="105" height="34" rx="6" fill="#4F46E5"/>
  <text x="410" y="420" font-size="12" font-weight="600" fill="#FFFFFF">Criar Tenant</text>
</svg>
